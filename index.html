<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자유 회로 구성 & 다중 나침반 실험실</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e293b; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background-color: #0f172a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
    h1 { font-size: 20px; color: #38bdf8; }
    .main-container { display: flex; flex: 1; height: calc(100vh - 60px); }
    .sidebar { width: 220px; background-color: #0f172a; border-right: 2px solid #334155; padding: 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .sidebar-title { font-size: 13px; font-weight: bold; color: #94a3b8; margin-top: 5px; margin-bottom: 2px; text-transform: uppercase; }
    .palette-item { background-color: #334155; border: 2px solid #475569; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: grab; transition: all 0.2s; }
    .palette-item:hover { background-color: #475569; border-color: #38bdf8; transform: translateY(-2px); }
    .palette-item span { font-size: 13px; font-weight: bold; }
    .item-icon { width: 40px; height: 30px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
    .workspace { flex: 1; position: relative; background-color: #0f172a; background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 20px 20px; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .controls-hint { position: absolute; bottom: 15px; right: 15px; background-color: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; padding: 10px 15px; border-radius: 8px; font-size: 13px; color: #38bdf8; pointer-events: none; }
    .btn-clear { margin-top: auto; background-color: #ef4444; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-clear:hover { background-color: #dc2626; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ 전류 & 다중 나침반 가상실험실</h1>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-title">전원 및 스위치</div>
      <div class="palette-item" draggable="true" data-type="battery">
        <div class="item-icon">🔋</div>
        <span>건전지 (9V)</span>
      </div>
      <div class="palette-item" draggable="true" data-type="switch">
        <div class="item-icon">🎚️</div>
        <span>스위치</span>
      </div>

      <div class="sidebar-title">전류/자기장 요소</div>
      <div class="palette-item" draggable="true" data-type="wire">
        <div class="item-icon">➖</div>
        <span>전선</span>
      </div>
      <div class="palette-item" draggable="true" data-type="coil">
        <div class="item-icon">🌀</div>
        <span>구리 코일</span>
      </div>
      <div class="palette-item" draggable="true" data-type="resistor">
        <div class="item-icon">⚡</div>
        <span>저항판 (20Ω)</span>
      </div>

      <div class="sidebar-title">측정 도구</div>
      <div class="palette-item" draggable="true" data-type="compass">
        <div class="item-icon">🧭</div>
        <span>나침반</span>
      </div>

      <button class="btn-clear" id="btnClear">초기화 🗑️</button>
    </div>

    <div class="workspace" id="workspace">
      <canvas id="circuitCanvas"></canvas>
      <div class="controls-hint">
        🎯 <b>업데이트:</b> 교과서형 원통 코일 형태 & 명확한 앞면 전류 화살표가 적용되었습니다!
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('circuitCanvas');
    const ctx = canvas.getContext('2d');
    const workspace = document.getElementById('workspace');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function resizeCanvas() {
      canvas.width = workspace.clientWidth;
      canvas.height = workspace.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let components = [];
    let selectedComponent = null;
    let draggedNode = null;
    let draggedComponent = null;
    let dragOffset = { x: 0, y: 0 };

    document.querySelectorAll('.palette-item').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('component-type', item.dataset.type);
      });
    });

    workspace.addEventListener('dragover', (e) => e.preventDefault());

    workspace.addEventListener('drop', (e) => {
      e.preventDefault();
      const type = e.dataTransfer.getData('component-type');
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      addComponent(type, x, y);
    });

    function addComponent(type, x, y) {
      const id = 'c_' + Date.now() + '_' + Math.floor(Math.random()*1000);
      if (type === 'battery') {
        components.push({
          id, type: 'battery', x, y,
          nodes: [
            { id: id+'_n1', x: x - 50, y: y, type: '-' },
            { id: id+'_n2', x: x + 50, y: y, type: '+' }
          ]
        });
      } else if (type === 'wire') {
        components.push({
          id, type: 'wire', x, y,
          nodes: [
            { id: id+'_n1', x: x - 50, y: y },
            { id: id+'_n2', x: x + 50, y: y }
          ]
        });
      } else if (type === 'coil') {
        components.push({
          id, type: 'coil', x, y,
          nodes: [
            { id: id+'_n1', x: x - 70, y: y },
            { id: id+'_n2', x: x + 70, y: y }
          ]
        });
      } else if (type === 'resistor') {
        components.push({
          id, type: 'resistor', x, y, resistance: 20,
          nodes: [
            { id: id+'_n1', x: x - 50, y: y },
            { id: id+'_n2', x: x + 50, y: y }
          ]
        });
      } else if (type === 'switch') {
        components.push({
          id, type: 'switch', x, y, isOpen: true,
          nodes: [
            { id: id+'_n1', x: x - 40, y: y },
            { id: id+'_n2', x: x + 40, y: y }
          ]
        });
      } else if (type === 'compass') {
        components.push({
          id, type: 'compass', x, y, radius: 26, angle: -Math.PI / 2
        });
      }
    }

    const SNAP_DIST = 35;

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      for (let comp of components) {
        if (comp.nodes) {
          for (let node of comp.nodes) {
            if (Math.hypot(node.x - mx, node.y - my) < 22) {
              draggedNode = { comp, node };
              return;
            }
          }
        }
      }

      for (let i = components.length - 1; i >= 0; i--) {
        let comp = components[i];
        if (comp.type === 'switch') {
          const midX = (comp.nodes[0].x + comp.nodes[1].x) / 2;
          const midY = (comp.nodes[0].y + comp.nodes[1].y) / 2;
          if (Math.hypot(midX - mx, midY - my) < 35 || isInsideComp(mx, my, comp)) {
            comp.isOpen = !comp.isOpen;
            playClickSound();
            selectedComponent = comp;
            return;
          }
        }
      }

      for (let i = components.length - 1; i >= 0; i--) {
        let comp = components[i];
        if (comp.type === 'compass') {
          if (Math.hypot(comp.x - mx, comp.y - my) < comp.radius) {
            selectedComponent = comp;
            draggedComponent = comp;
            dragOffset = { x: mx - comp.x, y: my - comp.y };
            return;
          }
        }

        if (isInsideComp(mx, my, comp)) {
          selectedComponent = comp;
          draggedComponent = comp;
          dragOffset = { x: mx - comp.x, y: my - comp.y };
          return;
        }
      }

      selectedComponent = null;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (draggedNode) {
        draggedNode.node.x = mx;
        draggedNode.node.y = my;
      } else if (draggedComponent) {
        const dx = mx - dragOffset.x - draggedComponent.x;
        const dy = my - dragOffset.y - draggedComponent.y;
        draggedComponent.x += dx;
        draggedComponent.y += dy;

        if (draggedComponent.nodes) {
          draggedComponent.nodes.forEach(n => { n.x += dx; n.y += dy; });
        }
      }
    });

    window.addEventListener('mouseup', () => {
      if (draggedNode) {
        let snapped = false;
        for (let comp of components) {
          if (!comp.nodes) continue;
          for (let node of comp.nodes) {
            if (node === draggedNode.node) continue;
            if (Math.hypot(node.x - draggedNode.node.x, node.y - draggedNode.node.y) < SNAP_DIST) {
              draggedNode.node.x = node.x;
              draggedNode.node.y = node.y;
              snapped = true;
              break;
            }
          }
          if (snapped) break;
        }
        if (snapped) playClickSound();
      }
      draggedNode = null;
      draggedComponent = null;
    });

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedComponent) {
        components = components.filter(c => c !== selectedComponent);
        selectedComponent = null;
      }
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      components = [];
      selectedComponent = null;
    });

    function isInsideComp(x, y, comp) {
      if (comp.nodes && comp.nodes.length === 2) {
        return distToSegment({x, y}, comp.nodes[0], comp.nodes[1]) < 22;
      }
      return false;
    }

    function distToSegment(p, v, w) {
      const l2 = (w.x - v.x)**2 + (w.y - v.y)**2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    // --- 물리 및 회로 계산 ---
    let activeSegments = [];
    let currentFactor = 1.0;

    function updatePhysics() {
      activeSegments = [];

      const batteries = components.filter(c => c.type === 'battery');
      if (batteries.length === 0) return;

      function areNodesConnected(n1, n2) {
        return Math.hypot(n1.x - n2.x, n1.y - n2.y) < SNAP_DIST;
      }

      for (let battery of batteries) {
        let startNode = battery.nodes[1]; // +극
        let targetNode = battery.nodes[0]; // -극

        let queue = [{ currentNode: startNode, path: [], visitedComps: new Set([battery.id]) }];

        while (queue.length > 0) {
          let { currentNode, path, visitedComps } = queue.shift();

          if (path.length > 0 && areNodesConnected(currentNode, targetNode)) {
            activeSegments.push({ comp: battery, p1: battery.nodes[0], p2: battery.nodes[1], isForward: true });
            
            let totalResistance = 5;
            path.forEach(item => {
              const isForward = (item.fromNode === item.comp.nodes[0]);
              activeSegments.push({ comp: item.comp, p1: item.fromNode, p2: item.toNode, isForward });
              if (item.comp.type === 'resistor') {
                totalResistance += item.comp.resistance || 20;
              }
            });

            currentFactor = 25 / totalResistance; 
            break;
          }

          if (queue.length > 100) break;

          for (let comp of components) {
            if (comp.type === 'compass' || visitedComps.has(comp.id)) continue;
            if (comp.type === 'switch' && comp.isOpen) continue;

            if (comp.nodes) {
              let connIdx = -1;
              if (areNodesConnected(comp.nodes[0], currentNode)) connIdx = 0;
              else if (areNodesConnected(comp.nodes[1], currentNode)) connIdx = 1;

              if (connIdx !== -1) {
                let nextNode = comp.nodes[1 - connIdx];
                let nextVisited = new Set(visitedComps);
                nextVisited.add(comp.id);

                queue.push({
                  currentNode: nextNode,
                  path: [...path, { comp, fromNode: comp.nodes[connIdx], toNode: nextNode }],
                  visitedComps: nextVisited
                });
              }
            }
          }
        }
      }

      // --- 나침반 반응 ---
      components.filter(c => c.type === 'compass').forEach(compass => {
        let B_x = 0;
        let B_y = -0.2; // 지구 자기장 (북쪽)

        activeSegments.forEach(seg => {
          if (seg.comp.type === 'coil') {
            const p1 = seg.p1;
            const p2 = seg.p2;
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            if (len === 0) return;

            const ux = dx / len;
            const uy = dy / len;
            const vx = -uy;
            const vy = ux;

            const nPole = { x: p2.x, y: p2.y };
            const sPole = { x: p1.x, y: p1.y };

            const dNx = compass.x - nPole.x;
            const dNy = compass.y - nPole.y;
            const distN2 = dNx*dNx + dNy*dNy + 100;
            const distN = Math.sqrt(distN2);
            const B_N_x = (dNx / distN) / distN2;
            const B_N_y = (dNy / distN) / distN2;

            const dSx = compass.x - sPole.x;
            const dSy = compass.y - sPole.y;
            const distS2 = dSx*dSx + dSy*dSy + 100;
            const distS = Math.sqrt(distS2);
            const B_S_x = -(dSx / distS) / distS2;
            const B_S_y = -(dSy / distS) / distS2;

            let B_ext_x = (B_N_x + B_S_x) * 450000 * currentFactor;
            let B_ext_y = (B_N_y + B_S_y) * 450000 * currentFactor;

            const cx = (p1.x + p2.x) / 2;
            const cy = (p1.y + p2.y) / 2;
            const rx = compass.x - cx;
            const ry = compass.y - cy;
            const localU = rx * ux + ry * uy;
            const localV = rx * vx + ry * vy;

            if (Math.abs(localU) < len / 2 + 30 && Math.abs(localV) < 120) {
              const coreStrength = 25 * currentFactor * Math.exp(-Math.pow(localV/60, 2));
              B_ext_x += ux * coreStrength;
              B_ext_y += uy * coreStrength;
            }

            B_x += B_ext_x;
            B_y += B_ext_y;
          } else {
            const res = distToSegment(compass, seg.p1, seg.p2);
            const dist = Math.max(res, 8);
            const B_mag = (3000 * currentFactor) / (dist * dist);
            const len = Math.hypot(seg.p2.x - seg.p1.x, seg.p2.y - seg.p1.y);
            if (len > 0) {
              const Ix = (seg.p2.x - seg.p1.x) / len;
              const Iy = (seg.p2.y - seg.p1.y) / len;
              B_x += -Iy * B_mag;
              B_y += Ix * B_mag;
            }
          }
        });

        const targetAngle = Math.atan2(B_y, B_x);
        let diff = targetAngle - compass.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        
        compass.angle += diff * 0.25;
      });
    }

    // --- 렌더링 ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      components.forEach(comp => {
        const isSelected = (comp === selectedComponent);

        if (comp.type === 'wire') {
          ctx.strokeStyle = isSelected ? '#38bdf8' : '#94a3b8';
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.moveTo(comp.nodes[0].x, comp.nodes[0].y);
          ctx.lineTo(comp.nodes[1].x, comp.nodes[1].y);
          ctx.stroke();
        } 
        else if (comp.type === 'coil') {
          drawCustomCoil(comp, isSelected);
        }
        else if (comp.type === 'resistor') {
          const p1 = comp.nodes[0];
          const p2 = comp.nodes[1];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const len = Math.hypot(dx, dy);
          const angle = Math.atan2(dy, dx);

          ctx.save();
          ctx.translate(p1.x, p1.y);
          ctx.rotate(angle);

          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(15, -12, len - 30, 24);
          ctx.strokeStyle = isSelected ? '#38bdf8' : '#b45309';
          ctx.lineWidth = 2;
          ctx.strokeRect(15, -12, len - 30, 24);

          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(15, 0);
          ctx.moveTo(len - 15, 0); ctx.lineTo(len, 0);
          ctx.stroke();

          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('20 Ω', len / 2, 4);

          ctx.restore();
        }
        else if (comp.type === 'battery') {
          ctx.strokeStyle = isSelected ? '#38bdf8' : '#cbd5e1';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(comp.nodes[0].x, comp.nodes[0].y);
          ctx.lineTo(comp.nodes[1].x, comp.nodes[1].y);
          ctx.stroke();

          ctx.fillStyle = '#ef4444';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText('+', comp.nodes[1].x - 18, comp.nodes[1].y - 8);
          ctx.fillStyle = '#3b82f6';
          ctx.fillText('-', comp.nodes[0].x + 8, comp.nodes[0].y - 8);
        }
        else if (comp.type === 'switch') {
          const p1 = comp.nodes[0];
          const p2 = comp.nodes[1];
          
          ctx.strokeStyle = isSelected ? '#38bdf8' : '#e2e8f0';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);

          if (comp.isOpen) {
            ctx.lineTo(p1.x + (p2.x - p1.x)*0.6, p1.y - 22);
          } else {
            ctx.lineTo(p2.x, p2.y);
          }
          ctx.stroke();

          const midX = (p1.x + p2.x) / 2;
          const midY = (p1.y + p2.y) / 2;
          ctx.fillStyle = comp.isOpen ? '#ef4444' : '#22c55e';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(comp.isOpen ? 'OFF' : 'ON', midX, midY - 25);
        }
        else if (comp.type === 'compass') {
          drawCompass(comp, isSelected);
        }

        if (comp.nodes) {
          comp.nodes.forEach(node => {
            let isConnected = false;
            for (let otherComp of components) {
              if (!otherComp.nodes) continue;
              for (let otherNode of otherComp.nodes) {
                if (otherNode !== node && Math.hypot(otherNode.x - node.x, otherNode.y - node.y) < SNAP_DIST) {
                  isConnected = true;
                  break;
                }
              }
              if (isConnected) break;
            }

            ctx.beginPath();
            ctx.arc(node.x, node.y, isConnected ? 9 : 7, 0, Math.PI * 2);
            ctx.fillStyle = isConnected ? '#22c55e' : (node.type === '+' ? '#ef4444' : (node.type === '-' ? '#3b82f6' : '#f59e0b'));
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
          });
        }
      });

      // 일반 전선 전류 표시
      if (activeSegments.length > 0) {
        const time = Date.now() * 0.01;
        const speed = 18 * currentFactor;

        activeSegments.forEach(seg => {
          if (seg.comp.type === 'coil') return;

          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 5;
          ctx.setLineDash([8, 6]);
          ctx.lineDashOffset = -time * speed;
          ctx.beginPath();
          ctx.moveTo(seg.p1.x, seg.p1.y);
          ctx.lineTo(seg.p2.x, seg.p2.y);
          ctx.stroke();
          ctx.setLineDash([]);
        });
      }
    }

    // --- 첨부 그림과 동일한 원통형 코일 렌더링 함수 ---
    function drawCustomCoil(comp, isSelected) {
      const p1 = comp.nodes[0];
      const p2 = comp.nodes[1];
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);

      const activeSeg = activeSegments.find(s => s.comp === comp);
      const isCurrentFlowing = !!activeSeg;
      const isP1toP2 = activeSeg ? (activeSeg.p1 === p1) : true;

      ctx.save();
      ctx.translate(p1.x, p1.y);
      ctx.rotate(angle);

      const loops = 5;
      const margin = 20;
      const spacing = (len - margin * 2) / loops;
      const rx = 10;  // 루프 좌우 반경
      const ry = 28;  // 루프 위아래 반경

      // 1. 단자 리드선
      ctx.strokeStyle = isSelected ? '#38bdf8' : '#d97706';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(margin, 0);
      ctx.moveTo(len - margin, 0); ctx.lineTo(len, 0);
      ctx.stroke();

      // 2. 뒤쪽 코일선 (어둡고 가늘게 처리하여 입체감 부여)
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 3;
      for (let i = 0; i < loops; i++) {
        const cx = margin + i * spacing + spacing / 2;
        ctx.beginPath();
        ctx.ellipse(cx, 0, rx, ry, 0, Math.PI * 0.5, Math.PI * 1.5, false);
        ctx.stroke();
      }

      // 3. 앞쪽 코일선 (그림처럼 명확하게 앞으로 넘어오는 고리 형태)
      ctx.strokeStyle = isSelected ? '#38bdf8' : '#f97316';
      ctx.lineWidth = 6;
      for (let i = 0; i < loops; i++) {
        const cx = margin + i * spacing + spacing / 2;
        ctx.beginPath();
        ctx.ellipse(cx, 0, rx, ry, 0, -Math.PI * 0.5, Math.PI * 0.5, false);
        ctx.stroke();
      }

      // 4. 그림 스타일의 명확한 전류 화살표 표시
      if (isCurrentFlowing) {
        ctx.fillStyle = '#facc15';
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5;

        for (let i = 0; i < loops; i++) {
          const cx = margin + i * spacing + spacing / 2;
          
          // 화살표 위치: 코일 앞쪽 호의 중간 지점
          const arrowX = cx + rx;
          const arrowY = 0;

          ctx.save();
          ctx.translate(arrowX, arrowY);

          // 흐름 방향에 따라 위➔아래 또는 아래➔위 방향 결정
          if (isP1toP2) {
            // 아래 방향 화살표 (그림과 동일)
            ctx.beginPath();
            ctx.moveTo(0, 10);
            ctx.lineTo(-7, -4);
            ctx.lineTo(7, -4);
            ctx.closePath();
          } else {
            // 위 방향 화살표
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(-7, 4);
            ctx.lineTo(7, 4);
            ctx.closePath();
          }

          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        // 5. 직관적인 전류 방향 안내 라벨
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';

        const directionText = isP1toP2 ? '⚡ 전류 방향: 위 ➔ 아래 (앞쪽)' : '⚡ 전류 방향: 아래 ➔ 위 (앞쪽)';
        ctx.fillText(directionText, len / 2, -ry - 12);
      }

      ctx.restore();
    }

    function drawCompass(comp, isSelected) {
      ctx.save();
      ctx.translate(comp.x, comp.y);
      ctx.beginPath();
      ctx.arc(0, 0, comp.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.fill();
      ctx.lineWidth = isSelected ? 3 : 2;
      ctx.strokeStyle = isSelected ? '#38bdf8' : '#64748b';
      ctx.stroke();

      ctx.rotate(comp.angle);

      // N극 (빨강)
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(comp.radius - 6, 0);
      ctx.lineTo(0, -5);
      ctx.fillStyle = '#ef4444';
      ctx.fill();

      // S극 (파랑)
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-(comp.radius - 6), 0);
      ctx.lineTo(0, 5);
      ctx.fillStyle = '#3b82f6';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
    }

    function loop() {
      updatePhysics();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
