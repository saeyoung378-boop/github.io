<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>별의 연주시차 게임</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  text-align: center;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #eef2ff;
  color: #1e293b;
}

h1 {
  margin: 5px 0 12px;
}

#info {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-bottom: 12px;
  font-size: 18px;
  font-weight: bold;
}

canvas {
  width: 800px;
  max-width: 100%;
  height: auto;
  border: 3px solid #334155;
  border-radius: 12px;
  background: #0f172a;
  touch-action: none;
}

button {
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  margin: 6px;
  font-size: 16px;
  cursor: pointer;
}

#restart {
  background: #2563eb;
  color: white;
}

/* 문제창 */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.7);
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 500;
}

.question-box {
  background: white;
  width: 480px;
  max-width: 100%;
  padding: 24px;
  border-radius: 16px;
}

.question-box h2 {
  margin-top: 0;
}

.choice {
  display: block;
  width: 100%;
  margin: 9px 0;
  text-align: left;
  background: #e2e8f0;
  color: #0f172a;
}

.choice:hover {
  background: #cbd5e1;
}

/* 해골 효과 */
#skullEffect {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

#dancingSkull {
  font-size: 120px;
  animation: skullDance 0.2s infinite alternate;
}

/* 해골 춤 */
@keyframes skullDance {
  0% {
    transform: rotate(-20deg) translateY(0);
  }

  50% {
    transform: rotate(20deg) translateY(-25px);
  }

  100% {
    transform: rotate(-20deg) translateY(0);
  }
}
</style>
</head>

<body>

<h1>🌟 별의 연주시차 게임</h1>

<div id="info">
  <span>점수: <b id="score">0</b></span>
  <span>목숨: <b id="lives">3</b></span>
  <span>맞힌 별: <b id="hits">0</b></span>
</div>

<canvas id="game" width="800" height="560"></canvas>

<br>

<button id="restart" onclick="restartGame()">다시 시작</button>

<p>
  ← → 방향키 또는 마우스로 아래쪽 바를 움직이세요.<br>
  공이 아래쪽 바에 닿으면 연주시차 문제가 나옵니다.
</p>

<!-- 문제창 -->
<div class="modal" id="questionModal">
  <div class="question-box">
    <h2>🔭 별 관측 문제</h2>
    <p id="questionText"></p>
    <div id="choices"></div>
  </div>
</div>

<!-- 목숨 감소 해골 효과 -->
<div id="skullEffect">
  <div id="dancingSkull">💀</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let score = 0;
let lives = 3;
let hits = 0;

let running = true;
let questionOpen = false;

// 게임 일시 정지 여부
let gamePaused = false;

// 공이 별을 향해 이동 중인지
let aimingAtStar = false;

// 별 표시 여부
let starVisible = true;

// 해골 효과 중복 실행 방지
let lifeEffectRunning = false;

const paddle = {
  x: 335,
  y: 500,
  w: 130,
  h: 16,
  speed: 8
};

const ball = {
  x: 400,
  y: 450,
  r: 10,
  vx: 3.2,
  vy: -4.5
};

// 별
const star = {
  x: 400,
  y: 155,
  r: 25
};

// 위쪽 바
const ceiling = {
  x: 0,
  y: 28,
  w: W,
  h: 14
};

// 문제 목록 (총 22문제)
const questions = [
  // 개념 및 정의 문제
  {
    text: "지구에서 6개월 간격으로 별을 관측했을 때 보이는 각도(시차)의 1/2을 무엇이라 하는가?",
    choices: ["연주시차", "일주시차", "시직경", "광년"],
    answer: "연주시차"
  },
  {
    text: "별의 연주시차가 발생하는 근본적인 원인은 무엇인가?",
    choices: ["지구의 공전", "지구의 자전", "별의 자전", "태양의 공전"],
    answer: "지구의 공전"
  },
  {
    text: "연주시차가 1초(1″)인 별까지의 거리를 나타내는 단위는 무엇인가?",
    choices: ["1 파섹(pc)", "1 광년(ly)", "1 천문단위(AU)", "1 킬로미터(km)"],
    answer: "1 파섹(pc)"
  },
  {
    text: "지구에서 관측한 6개월 동안의 최대 이동 각도가 0.8초일 때, 이 별의 연주시차는?",
    choices: ["0.4초", "0.8초", "1.6초", "0.2초"],
    answer: "0.4초"
  },
  {
    text: "별의 거리(d)와 연주시차(p)의 관계를 올바르게 나타낸 식은?",
    choices: ["d(pc) = 1 / p(″)", "d(pc) = p(″)", "d(pc) = 1 + p(″)", "d(pc) = p(″) / 2"],
    answer: "d(pc) = 1 / p(″)"
  },
  {
    text: "연주시차와 별까지의 거리는 어떤 관계인가?",
    choices: ["반비례 관계", "정비례 관계", "제곱 비례 관계", "아무 관계 없음"],
    answer: "반비례 관계"
  },
  {
    text: "지구에서 매우 먼 거리(약 100pc 이상)에 있는 별은 연주시차를 측정하기 어렵다. 그 이유는?",
    choices: ["연주시차가 너무 작아지기 때문에", "연주시차가 너무 커지기 때문에", "별이 너무 밝아지기 때문에", "지구 공전이 멈추기 때문에"],
    answer: "연주시차가 너무 작아지기 때문에"
  },
  {
    text: "별까지의 거리가 멀어질수록 연주시차의 크기는 어떻게 되는가?",
    choices: ["작아진다", "커진다", "변함없다", "0.5초로 일정하다"],
    answer: "작아진다"
  },
  {
    text: "1파섹(pc)은 약 몇 광년(ly)에 해당하는가?",
    choices: ["약 3.26 광년", "약 1.0 광년", "약 10 광년", "약 300 광년"],
    answer: "약 3.26 광년"
  },

  // 연주시차 -> 거리 계산 문제
  {
    text: "연주시차가 0.5초(″)인 별까지의 거리는 몇 파섹인가?",
    choices: ["2 파섹", "0.5 파섹", "1 파섹", "5 파섹"],
    answer: "2 파섹"
  },
  {
    text: "연주시차가 0.25초(″)인 별까지의 거리는 몇 파섹인가?",
    choices: ["4 파섹", "0.25 파섹", "2 파섹", "8 파섹"],
    answer: "4 파섹"
  },
  {
    text: "연주시차가 0.2초(″)인 별까지의 거리는 몇 파섹인가?",
    choices: ["5 파섹", "2 파섹", "0.2 파섹", "10 파섹"],
    answer: "5 파섹"
  },
  {
    text: "연주시차가 0.1초(″)인 별까지의 거리는 몇 파섹인가?",
    choices: ["10 파섹", "1 파섹", "5 파섹", "100 파섹"],
    answer: "10 파섹"
  },
  {
    text: "연주시차가 0.05초(″)인 별까지의 거리는 몇 파섹인가?",
    choices: ["20 파섹", "5 파섹", "10 파섹", "50 파섹"],
    answer: "20 파섹"
  },
  {
    text: "연주시차가 0.02초(″)인 별까지의 거리는 몇 파섹인가?",
    choices: ["50 파섹", "20 파섹", "100 파섹", "2 파섹"],
    answer: "50 파섹"
  },
  {
    text: "연주시차가 0.01초(″)인 별까지의 거리는 몇 파섹인가?",
    choices: ["100 파섹", "10 파섹", "50 파섹", "1000 파섹"],
    answer: "100 파섹"
  },

  // 거리 -> 연주시차 계산 및 비교 문제
  {
    text: "지구로부터 거리가 5파섹(pc)인 별의 연주시차는 얼마인가?",
    choices: ["0.2초", "0.5초", "0.1초", "2초"],
    answer: "0.2초"
  },
  {
    text: "지구로부터 거리가 10파섹(pc)인 별의 연주시차는 얼마인가?",
    choices: ["0.1초", "0.2초", "1초", "0.01초"],
    answer: "0.1초"
  },
  {
    text: "지구로부터 거리가 20파섹(pc)인 별의 연주시차는 얼마인가?",
    choices: ["0.05초", "0.2초", "0.5초", "0.02초"],
    answer: "0.05초"
  },
  {
    text: "별 A의 거리가 2pc, 별 B의 거리가 8pc일 때 연주시차가 더 큰 별은?",
    choices: ["별 A", "별 B", "두 별이 같다", "알 수 없다"],
    answer: "별 A"
  },
  {
    text: "별 A의 연주시차가 0.4초, 별 B의 연주시차가 0.1초일 때, 별 B는 별 A보다 몇 배 더 멀리 있는가?",
    choices: ["4배", "2배", "8배", "0.25배"],
    answer: "4배"
  },
  {
    text: "어떤 별까지의 거리가 10광년이다. 별빛이 지구까지 오는 데 걸리는 시간은?",
    choices: ["10년", "5년", "20년", "100년"],
    answer: "10년"
  }
];

function updateInfo() {
  document.getElementById("score").textContent = score;
  document.getElementById("lives").textContent = lives;
  document.getElementById("hits").textContent = hits;
}

// 별 그리기
function drawStar(x, y, r) {
  ctx.save();
  ctx.translate(x, y);

  ctx.beginPath();

  for (let i = 0; i < 10; i++) {
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    const radius = i % 2 === 0 ? r : r * 0.45;

    const px = Math.cos(angle) * radius;
    const py = Math.sin(angle) * radius;

    if (i === 0) {
      ctx.moveTo(px, py);
    } else {
      ctx.lineTo(px, py);
    }
  }

  ctx.closePath();

  ctx.fillStyle = "#facc15";
  ctx.fill();

  ctx.strokeStyle = "#fde68a";
  ctx.stroke();

  ctx.restore();
}

// 화면 그리기
function draw() {
  ctx.clearRect(0, 0, W, H);

  // 배경 별
  ctx.fillStyle = "#cbd5e1";

  for (let i = 0; i < 40; i++) {
    const x = (i * 137) % W;
    const y = 55 + ((i * 83) % 400);

    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // 위쪽 바
  ctx.fillStyle = "#475569";
  ctx.fillRect(
    ceiling.x,
    ceiling.y,
    ceiling.w,
    ceiling.h
  );

  ctx.strokeStyle = "#cbd5e1";
  ctx.lineWidth = 2;
  ctx.strokeRect(
    ceiling.x,
    ceiling.y,
    ceiling.w,
    ceiling.h
  );

  // 별
  if (starVisible) {
    drawStar(star.x, star.y, star.r);
  }

  // 공
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#f8fafc";
  ctx.fill();

  // 아래쪽 바
  ctx.fillStyle = "#38bdf8";
  ctx.fillRect(
    paddle.x,
    paddle.y,
    paddle.w,
    paddle.h
  );
}

// 공 초기화
function resetBall(direction = -1) {
  ball.x = 400;
  ball.y = 450;

  ball.vx = Math.random() > 0.5 ? 3.2 : -3.2;
  ball.vy = direction * 4.5;

  aimingAtStar = false;
}

// 아래쪽 바 이동
function movePaddle(dx) {
  paddle.x += dx;

  paddle.x = Math.max(
    0,
    Math.min(W - paddle.w, paddle.x)
  );
}

// 키보드 조작
document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowLeft") {
    movePaddle(-paddle.speed);
  }

  if (event.key === "ArrowRight") {
    movePaddle(paddle.speed);
  }
});

// 마우스 조작
canvas.addEventListener("mousemove", function(event) {
  const rect = canvas.getBoundingClientRect();

  paddle.x =
    (event.clientX - rect.left) * (W / rect.width)
    - paddle.w / 2;

  paddle.x = Math.max(
    0,
    Math.min(W - paddle.w, paddle.x)
  );
});

// 터치 조작
canvas.addEventListener("touchmove", function(event) {
  const touch = event.touches[0];
  const rect = canvas.getBoundingClientRect();

  paddle.x =
    (touch.clientX - rect.left) * (W / rect.width)
    - paddle.w / 2;

  paddle.x = Math.max(
    0,
    Math.min(W - paddle.w, paddle.x)
  );

  event.preventDefault();
}, { passive: false });

// 문제 출제
function showQuestion() {
  const question =
    questions[Math.floor(Math.random() * questions.length)];

  document.getElementById("questionText").textContent =
    question.text;

  const choicesBox = document.getElementById("choices");
  choicesBox.innerHTML = "";

  const shuffledChoices =
    [...question.choices].sort(() => Math.random() - 0.5);

  shuffledChoices.forEach(function(choice) {
    const button = document.createElement("button");

    button.className = "choice";
    button.textContent = choice;

    button.onclick = function() {
      answerQuestion(choice, question.answer);
    };

    choicesBox.appendChild(button);
  });

  questionOpen = true;

  document.getElementById("questionModal").style.display = "flex";
}

// 목숨 감소 + 해골 효과
function loseLife(callback) {
  if (lifeEffectRunning || !running) return;

  lifeEffectRunning = true;

  // 목숨 1 감소
  lives--;
  updateInfo();

  // 게임 정지
  gamePaused = true;

  // 해골 등장
  const skull = document.getElementById("skullEffect");
  skull.style.display = "flex";

  // 1초 후 게임 재개
  setTimeout(function() {
    skull.style.display = "none";

    lifeEffectRunning = false;

    if (lives <= 0) {
      running = false;
      gamePaused = true;

      alert("게임 오버! 다시 시작 버튼을 눌러 주세요.");
      return;
    }

    gamePaused = false;

    if (callback) {
      callback();
    }

  }, 1000);
}

// 정답 또는 오답 처리
function answerQuestion(selected, answer) {
  if (!questionOpen || gamePaused) return;

  questionOpen = false;

  document.getElementById("questionModal").style.display = "none";

  if (selected === answer) {

    // 정답
    score += 20;
    updateInfo();

    // 공이 별을 향해 이동
    const dx = star.x - ball.x;
    const dy = star.y - ball.y;

    const distance = Math.hypot(dx, dy) || 1;
    const speed = 5.2;

    ball.vx = dx / distance * speed;
    ball.vy = dy / distance * speed;

    aimingAtStar = true;

  } else {

    // 오답
    aimingAtStar = false;

    ball.vx = Math.random() > 0.5 ? 3.2 : -3.2;
    ball.vy = -4.5;

    loseLife(function() {
      // 해골 효과가 끝난 뒤 공은 계속 위쪽 바를 향해 이동
    });
  }
}

// 게임 업데이트
function update() {
  if (!running || questionOpen || gamePaused) return;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // 좌우 벽 충돌
  if (
    ball.x - ball.r <= 0 ||
    ball.x + ball.r >= W
  ) {
    ball.vx *= -1;

    ball.x = Math.max(
      ball.r,
      Math.min(W - ball.r, ball.x)
    );
  }

  // 위쪽 바 충돌
  if (
    ball.vy < 0 &&
    ball.y - ball.r <= ceiling.y + ceiling.h
  ) {
    ball.y = ceiling.y + ceiling.h + ball.r;

    ball.vy = Math.abs(ball.vy);
  }

  // 별과 공의 거리
  const distanceToStar = Math.hypot(
    ball.x - star.x,
    ball.y - star.y
  );

  // 별 충돌
  if (
    aimingAtStar &&
    starVisible &&
    distanceToStar <= ball.r + star.r
  ) {

    score += 50;
    hits++;

    updateInfo();

    // 별 사라짐
    starVisible = false;

    // 공은 계속 위쪽으로 이동
    aimingAtStar = false;

    return;
  }

  // 아래쪽 바 충돌
  if (
    ball.vy > 0 &&
    ball.y + ball.r >= paddle.y &&
    ball.y - ball.r <= paddle.y + paddle.h &&
    ball.x >= paddle.x &&
    ball.x <= paddle.x + paddle.w
  ) {

    ball.y = paddle.y - ball.r;
    ball.vy = -Math.abs(ball.vy);

    if (!starVisible) {

      star.x = 100 + Math.random() * (W - 200);
      star.y = 100 + Math.random() * 130;

      starVisible = true;
    }

    showQuestion();

    return;
  }

  // 아래쪽 바를 놓침
  if (ball.y - ball.r > H) {

    // 목숨 감소 + 해골 효과
    loseLife(function() {
      resetBall(-1);
    });
  }
}

// 다시 시작
function restartGame() {
  score = 0;
  lives = 3;
  hits = 0;

  running = true;
  questionOpen = false;
  gamePaused = false;
  aimingAtStar = false;
  starVisible = true;
  lifeEffectRunning = false;

  paddle.x = 335;

  star.x = 400;
  star.y = 155;

  document.getElementById("questionModal").style.display = "none";
  document.getElementById("skullEffect").style.display = "none";

  resetBall(-1);
  updateInfo();
}

// 게임 실행
updateInfo();
resetBall(-1);

function gameLoop() {
  update();
  draw();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
